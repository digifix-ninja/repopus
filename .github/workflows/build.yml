# Builds Repopus for macOS (Apple Silicon and Intel), Windows and Linux on GitHub's servers.
#
# Two ways it runs:
#   * Version tag pushed (git tag v0.1.0 && git push origin v0.1.0): installers are attached
#     to a *draft* release, so nothing is public until you press "Publish" on GitHub.
#   * Started by hand (Actions → Build Repopus → Run workflow): installers are kept as downloadable
#     "artifacts" of the run (no release is made).

name: Build Repopus

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the draft release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: windows
            platform: windows-latest
            args: ""
          - name: linux
            platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils libdbus-1-dev pkg-config

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build (and attach to a draft release for version tags)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # An empty tag name means "just build, no release".
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: "Repopus v__VERSION__"
          releaseBody: "See the assets below for macOS, Windows and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installers as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repopus-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
