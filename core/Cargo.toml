[package]
name = "repopus-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["stean.DEV"]
description = "Sync engine for Repopus: checks GitHub repositories and keeps local zip/folder copies up to date"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
